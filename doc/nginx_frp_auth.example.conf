# =============================================================================
# frp vhost + nginx 按接口分流示例
#
# 场景：部分接口经 frp 隧道转发到内网，另一部分直连内网服务；
#       外部客户端不感知 frp 的鉴权，由 nginx 写死 X-FRP-Auth。
#
# 用法：
#   1) 生成凭据：printf 'alice:s3cret' | base64
#   2) 替换下面 $frp_auth 的值（注意 Basic 后面有一个空格）
#   3) nginx -t && nginx -s reload
#
# 放置位置：/etc/nginx/conf.d/frp-api.conf（需要包含在 http {} 内）
# =============================================================================

# frps 的 vhostHTTPPort（不是 bindPort）
upstream frp_vhost {
    server 127.0.0.1:8180;

    # 与 frps 之间复用连接，减少握手开销
    keepalive 16;
}

server {
    listen 80;
    server_name web01.example.com;

    # ---------------------------------------------------------------------
    # frp 凭据：写死在这里，客户端就不需要自己带 X-FRP-Auth
    # 密码变更后必须同步改这里，否则 frps 会返回 401
    # ---------------------------------------------------------------------
    set $frp_auth "Basic YWxpY2U6czNjcmV0";

    # ---------------------------------------------------------------------
    # 转发公共头
    # ---------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Connection "";

    # frps 靠 Host 选择路由，必须传对。
    # 若对外域名与 frpc 里 customDomains 不一致，改成写死：
    #   proxy_set_header Host "web01.example.com";
    proxy_set_header Host $host;

    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    proxy_connect_timeout 5s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # ---------------------------------------------------------------------
    # 1. 需要走 frp 的接口：注入 X-FRP-Auth
    # ---------------------------------------------------------------------
    location /api/ {
        # proxy_set_header 是「覆盖」语义：客户端即使自己带了也会被替换，
        # 无法伪造凭据，也不会把客户端塞的假值透传出去。
        proxy_set_header X-FRP-Auth $frp_auth;

        # 末尾不带 URI，原样保留请求路径（frps 按 locations 匹配路径）
        proxy_pass http://frp_vhost;
    }

    # SSE / 长轮询接口：关闭缓冲，避免响应被攒着不发
    location /api/stream {
        proxy_set_header X-FRP-Auth $frp_auth;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_pass http://frp_vhost;
    }

    # WebSocket 接口
    location /ws/ {
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-FRP-Auth $frp_auth;
        proxy_read_timeout 3600s;
        proxy_pass http://frp_vhost;
    }

    # 如果需要对 frp 那侧去掉路径前缀（/api/v1/x -> /v1/x），
    # 在 proxy_pass 末尾加一个 / 即可：
    #   location /api/ { proxy_pass http://frp_vhost/; }
    # 注意此时 frpc 的 locations 也要能匹配到 /v1/x。

    # ---------------------------------------------------------------------
    # 2. 不走 frp 的接口：直连内网服务
    # ---------------------------------------------------------------------
    location /internal/ {
        # 空值表示不向后端发送该头，避免客户端伪造的 X-FRP-Auth 流进内网服务
        proxy_set_header X-FRP-Auth "";

        # 直连后端的 Host 通常需要单独指定
        proxy_set_header Host "internal.example.com";

        proxy_pass http://10.0.0.20:8080;
    }

    # ---------------------------------------------------------------------
    # 3. 其余流量仍然走 frp
    # ---------------------------------------------------------------------
    location / {
        proxy_set_header X-FRP-Auth $frp_auth;
        proxy_pass http://frp_vhost;
    }

    # ---------------------------------------------------------------------
    # 可选：nginx 自身也需要保护
    # 因为客户端不带任何 frp 凭据就能访问这些接口，nginx 就是唯一入口了。
    # ---------------------------------------------------------------------
    # location /api/ {
    #     allow 192.168.1.0/24;
    #     allow 203.0.113.7;
    #     deny all;
    #
    #     auth_basic "restricted";
    #     auth_basic_user_file /etc/nginx/.htpasswd;
    #
    #     proxy_set_header X-FRP-Auth $frp_auth;
    #     proxy_pass http://frp_vhost;
    # }
}

# =============================================================================
# 多个 frp 代理使用不同账号时，分别定义变量即可：
#
#   set $frp_auth_a "Basic <base64(alice:pass-a)>";
#   set $frp_auth_b "Basic <base64(bob:pass-b)>";
#
#   location /api/a/ { proxy_set_header X-FRP-Auth $frp_auth_a; proxy_pass http://frp_vhost; }
#   location /api/b/ { proxy_set_header X-FRP-Auth $frp_auth_b; proxy_pass http://frp_vhost; }
#
# 注意：
#   1) frpc 侧若配置了 allowIPs，要把 nginx 的出口 IP 加进白名单
#      （同机部署是 127.0.0.1，跨机则是 nginx 的内网地址）。
#   2) frps 在转发前会删掉 X-FRP-Auth，源站看不到这个头，无需担心污染业务。
#   3) 一旦 nginx 统一注入凭据，就不需要 frp 的登录页了，httpAuthPagePath 可留空。
# =============================================================================
